# Environment Variable Setting
################################################################################
dotenv_path: null


# Logging Setting
################################################################################
log_root_dir: logs/atom_tagging

# experiment_name: would be used to create log_dir = log_root_dir/experiment_name/
experiment_name: musique_dev_500


# Document Loading & Saving
# ################################################################################
ori_doc_loading:
  module: pikerag.utils.data_protocol_utils
  name: load_chunks_from_jsonl
  args:
    jsonl_chunk_path: data/musique/dev_500_retrieval_contexts_as_chunks.jsonl

tagged_doc_saving:
  module: pikerag.utils.data_protocol_utils
  name: save_chunks_to_jsonl
  args:
    dump_path: data/musique/dev_500_retrieval_contexts_as_chunks_with_atom_questions.jsonl


# Tagger Setting
################################################################################
tagger:
  tagging_protocol:
    module_path: pikerag.prompts.tagging
    attr_name: atom_question_tagging_protocol

  tag_name: atom_questions
  
  # 多线程配置：设置并发处理的线程数
  # 推荐值：2-8，根据你的API限制和机器性能调整
  num_parallel: 4


# Monitoring Setting (监控配置)
################################################################################
monitoring:
  # 是否启用API监控
  enable: true
  
  # RPM监控窗口时间（分钟）
  rpm_window_minutes: 1
  
  # RPM限制警告阈值（可选，用于运行时警告）
  rpm_warning_threshold: 50


# LLM Setting
################################################################################
llm_client:
  module_path: pikerag.llm_client
  class_name: CompanyOpenAIClient
  args: {}

  llm_config:
    model: gpt-4o-mini
    temperature: 0

  cache_config:
    # location_prefix: will be joined with log_dir to generate the full path;
    #   if set to null, the experiment_name would be used
    location_prefix: null
    auto_dump: True
